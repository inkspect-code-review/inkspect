name: self-hosted distribution
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: ./install.sh --check
      - run: ./install.sh --prepare --directory /tmp/inkspect-instance --origin https://review.example.com
      - run: docker compose --env-file /tmp/inkspect-instance/.env -f /tmp/inkspect-instance/compose.yaml config --quiet
