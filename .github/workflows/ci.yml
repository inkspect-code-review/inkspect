name: self-hosted distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose -f compose.setup.yaml run --rm test
      - run: docker compose -f compose.setup.yaml run --rm setup
      - run: docker compose config --quiet
      - name: Verify realtime build and runtime configuration
        run: |
          printf '\nNEXT_PUBLIC_PUBB_APP_KEY=compose-realtime-public-test\nPUBB_APP_ID=compose-realtime-test\nPUBB_APP_SECRET=compose-realtime-secret-test\n' >> .env
          docker compose config --format json > /tmp/inkspect-compose-config.json
          docker compose build --print web > /tmp/inkspect-web-build.json
          docker run --rm -v "$PWD:/distribution:ro" -v /tmp/inkspect-compose-config.json:/tmp/config.json:ro -v /tmp/inkspect-web-build.json:/tmp/build.json:ro -w /distribution node:22-bookworm-slim node tests/realtime-build.mjs /tmp/config.json /tmp/build.json
      - run: docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - run: docker compose build --print > /tmp/inkspect-build.json
      - name: Check SSH overlay and pin consistency without credentials
        run: |
          SSH_AUTH_SOCK=/tmp/unused-agent docker compose -f compose.yaml -f compose.ssh.yaml config --quiet
          docker run --rm -v "$PWD:/distribution:ro" -w /distribution node:22-bookworm-slim node tests/source-pins.mjs
