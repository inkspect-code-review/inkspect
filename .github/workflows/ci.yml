name: self-hosted distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: ./install.sh --check
      - run: ./install.sh --prepare --directory /tmp/inkspect-instance --origin https://review.example.com
      - run: docker compose --env-file /tmp/inkspect-instance/.env -f /tmp/inkspect-instance/compose.yaml config --quiet
